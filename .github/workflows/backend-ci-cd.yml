name: Sion Backend CI/CD

on:
  push:
    branches:
      - main
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Go 설정
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: 의존성 다운로드
        run: go mod download

      - name: 테스트
        # pure-Go sqlite (glebarez/sqlite)를 쓰므로 CGO 없이도 모든 테스트가 통과한다.
        run: CGO_ENABLED=0 go test ./...

      - name: 바이너리 빌드
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o server .

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/tolelom/sion-api:latest
          platforms: linux/arm64

      - name: 시크릿 존재 여부 확인
        # 시크릿 값 자체는 노출하지 않고 비어있는지만 출력. 비어있으면 즉시 실패시켜
        # SSH 단계에 가기 전에 원인을 명확히 한다.
        run: |
          missing=""
          [ -z "${{ secrets.SERVER_HOST }}" ] && missing="$missing SERVER_HOST"
          [ -z "${{ secrets.SERVER_USER }}" ] && missing="$missing SERVER_USER"
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::필수 시크릿 누락:$missing"
            exit 1
          fi
          echo "필수 시크릿 모두 존재."

      - name: 서버에 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # SSH handshake / 명령 실패 지점을 정확히 보이게 한다.
          debug: true
          script_stop: true
          command_timeout: 5m
          script: |
            set -euxo pipefail
            export PATH=$PATH:/usr/local/bin:/opt/homebrew/bin:$HOME/.docker/bin
            echo "host=$(hostname) user=$(whoami) pwd=$(pwd)"
            ls -la ~/server || { echo "ERROR: ~/server 디렉토리 없음"; exit 1; }
            cd ~/server
            docker compose pull sion-api
            docker compose up -d sion-api
            docker compose ps sion-api