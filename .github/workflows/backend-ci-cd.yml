name: Sion Backend CI/CD

on:
  push:
    branches:
      - main
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Go 설정
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: 의존성 다운로드
        run: go mod download

      - name: 테스트
        # pure-Go sqlite (glebarez/sqlite)를 쓰므로 CGO 없이도 모든 테스트가 통과한다.
        run: CGO_ENABLED=0 go test ./...

      - name: 바이너리 빌드
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o server .

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/tolelom/sion-api:latest
          platforms: linux/arm64
        # 배포 서버는 GHCR에서 latest 이미지를 직접 polling/watch해 자동으로 갱신한다.
        # 따라서 CI 측에서는 별도 SSH 배포 단계가 필요 없다.